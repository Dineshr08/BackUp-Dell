<!-- Example of using objects . Here we created object const score = {
        win : 0,
        loss : 0,
        tie : 0
      } and we add if (result === 'You Won') {
          score.win += 1;
        } else if (result === 'You Lost') {
          score.loss += 1;
        } else if (result === 'Tie') {
          score.tie += 1;
        }
 to store the all our results and on popup we displaying the results alert(`You picked ${playerMove}, computer picked ${computerMove}, ${result}
Win: ${score.win}, Loss: ${score.loss}, Tie: ${score.tie}`);  here we added new line in template string to show results in next line in popup-->

<!DOCTYPE html>
<html>
  <head>
    <title>
      Rock Paper Scissor
    </title>
  </head>
  <body>
    <p>
      Rock Paper Scissors - Functions
    </p>
    <button onclick="
      playGame('rock');
    ">Rock</button>
    <button onclick="
      playGame('paper');
    ">Paper</button>
    <button onclick="
      playGame('scissors');
    ">Scissors</button>
    <script>

      //We have created object here, to store the results in the popup

      const score = {
        win : 0,
        loss : 0,
        tie : 0
      }

    

      function playGame(playerMove) {

        const computerMove = pickComputerMove();
        let result = '';
        

        if (playerMove === 'rock'){

          if (computerMove === 'rock')
          {
            result = 'tie';
          }
          else if (computerMove === 'paper')
          {
            result = 'You Lost';
          }
          else if (computerMove === 'scissors')
          {
            result = 'You Won';
          }

        } else if (playerMove === 'paper') {

            if (computerMove === 'rock')
            {
              result = 'You Won';
            }
            else if (computerMove === 'paper')
            {
              result = 'Tie';
            }
            else if (computerMove === 'scissors')
            {
              result = 'You Lost';
            }
            
        } else if (playerMove === 'scissors') {

          if (computerMove === 'rock')
          {
            result = 'You Lost';
          }
          else if (computerMove === 'paper')
          {
            result = 'You Won';
          }
          else if (computerMove === 'scissors')
          {
            result = 'Tie';
          }
          
        }
//We have appended the results to score, so in popup everytime we click it show the ober all results
        if (result === 'You Won') {
          score.win += 1;
        } else if (result === 'You Lost') {
          score.loss += 1;
        } else if (result === 'Tie') {
          score.tie += 1;
        }

//On template string we can add multi line string, if we give spaces it will take that space that why we remove the space and moved to left. Here we displaying the results in the popup
        alert(`You picked ${playerMove}, computer picked ${computerMove}, ${result}
Win: ${score.win}, Loss: ${score.loss}, Tie: ${score.tie}`);
      }
      function pickComputerMove(){
        const randomNum = Math.random();
        let computerMove = '';
        if ( randomNum >= 0 && randomNum < 1 / 3 )
        {
          computerMove = 'rock'
        }
        else if ( randomNum >= 1 / 3 && randomNum < 2 / 3 )
        {
          computerMove = 'paper'
        }
        else if ( randomNum >= 2 / 3 && randomNum < 1 )
        {
          computerMove = 'scissors'
        }
        return computerMove;
      }
    </script>
  </body>
</html>
