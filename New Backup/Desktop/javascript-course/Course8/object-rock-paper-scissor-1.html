<!-- Here what we are doing is implementing local storage concept. After refresh all the win, loss, tie will go as 0 inorder to prevent that we are doing local storage and add new button reset score. if we click this all will become 0-->

<!DOCTYPE html>
<html>
  <head>
    <title>
      Rock Paper Scissor
    </title>
  </head>
  <body>
    <p>
      Rock Paper Scissors - Functions
    </p>
    <button onclick="
      playGame('rock');
    ">Rock</button>
    <button onclick="
      playGame('paper');
    ">Paper</button>
    <button onclick="
      playGame('scissors');
    ">Scissors</button>
    <!--  Step3: Here after clicking this we are reseting everything to 0 ie let score = JSON.parse(localStorage.getItem('score')); to 0 but data on ui will displayed based on local storage and it will be stored in local storage evenwe resetting this to 0 that dosent make any sense so we need to remove that so we are doing localStorage remove item-->
    <button onclick="
      score.win = 0;
      score.loss= 0;
      score.tie = 0;
      localStorage.removeItem('score');//We are removing score from local storage when we click the button , so in local storage score will not be there, it will be null. When we click the rock, paper, scissor button we will get error as it donest have a local storeage variable as we remobved so we will get error, so to fix that we are working on step4
    ">Reset Score</button>
    <script>




      /* const score = {
        win : 0,
        loss : 0,
        tie : 0
      } */

      // Step2: what we are doing is we are commenting above and assigning score to below local storage by get the data currently available in local storage. becuase everytime itneeds to take from previous so we are getting the data from local storage and assigning to score. Score ealier above was js object and need to store it in the same so we are converting back to js object we used parse after getting the data from local storeage.local storage will have latest or history data ie with all the results
      //const score = JSON.parse(localStorage.getItem('score')); - We are changing from const to let as we reassigning the variable below at this step if(score === null) {
      
      let score = JSON.parse(localStorage.getItem('score'));

      //Step4: let score = JSON.parse(localStorage.getItem('score')); score will not be there as we removed so to fix this we are doing below, we no score ir if score = null. Even both score === null and !score are same, we are do falsy here. or we can do like this  const score = JSON.parse(localStorage.getItem('score')) || {win:0,loss:0,tie:0}; as we apply default operator here if true assign score = JSON.parse(localStorage.getItem('score')) ie truthy else {win:0,loss:0,tie:0} falsy

      if(score === null) {
        score = {
          win : 0,
          loss : 0,
          tie: 0
      }
    }

    

      function playGame(playerMove) {

        const computerMove = pickComputerMove();
        let result = '';
        

        if (playerMove === 'rock'){

          if (computerMove === 'rock')
          {
            result = 'tie';
          }
          else if (computerMove === 'paper')
          {
            result = 'You Lost';
          }
          else if (computerMove === 'scissors')
          {
            result = 'You Won';
          }

        } else if (playerMove === 'paper') {

            if (computerMove === 'rock')
            {
              result = 'You Won';
            }
            else if (computerMove === 'paper')
            {
              result = 'Tie';
            }
            else if (computerMove === 'scissors')
            {
              result = 'You Lost';
            }
            
        } else if (playerMove === 'scissors') {

          if (computerMove === 'rock')
          {
            result = 'You Lost';
          }
          else if (computerMove === 'paper')
          {
            result = 'You Won';
          }
          else if (computerMove === 'scissors')
          {
            result = 'Tie';
          }
          
        }

        if (result === 'You Won') {
          score.win += 1;
        } else if (result === 'You Lost') {
          score.loss += 1;
        } else if (result === 'Tie') {
          score.tie += 1;
        }
      

        //Step1. setting the score object in local storage so everytime after refresh it wont remove. localstorage will take string so we are converting js object to json, json will be string. Now we have set the data to score which in local storage

        localStorage.setItem('score', JSON.stringify(score));


        alert(`You picked ${playerMove}, computer picked ${computerMove}, ${result}
Win: ${score.win}, Loss: ${score.loss}, Tie: ${score.tie}`);
      }
      function pickComputerMove(){
        const randomNum = Math.random();
        let computerMove = '';
        if ( randomNum >= 0 && randomNum < 1 / 3 )
        {
          computerMove = 'rock'
        }
        else if ( randomNum >= 1 / 3 && randomNum < 2 / 3 )
        {
          computerMove = 'paper'
        }
        else if ( randomNum >= 2 / 3 && randomNum < 1 )
        {
          computerMove = 'scissors'
        }
        return computerMove;
      }
    </script>
  </body>
</html>
