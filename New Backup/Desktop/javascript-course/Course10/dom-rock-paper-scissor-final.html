<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" href="styles/rock-papaer-scissor.css">  
    <title>
      Rock Paper Scissor - Dom
    </title>
  </head>
  <body>
    <p class="title">
      Rock Paper Scissors
    </p>
    <button onclick="
      playGame('rock');
    " class="move-button">
    <img src="images/rock-emoji.png" class="move-icon">
    ></button>
    <button onclick="
      playGame('paper');
    " class="move-button">
    <img src="images/paper-emoji.png" class="move-icon">
    </button>
    <button onclick="
      playGame('scissors');
    " class="move-button">
    <img src="images/scissors-emoji.png" class="move-icon">
    </button>

    <!-- Step5: we created this paragraph top show what is our rsult in page-->
    <p class="js-result result"></p>

    <!-- Step6: we created this paragraph top show what is our move and computer move in page-->
    <p class="js-moves"></p>

    <!-- Step1 Here we created a paragraph and get the data from dom. We are created this function updateScoreElement and here we called js-score class we we using dom and update the data -->
    <p class="js-score score"></p>

    
   
    <button onclick="
      score.win = 0;
      score.loss= 0;
      score.tie = 0;
      localStorage.removeItem('score');
      //step4: We have called here as when we click on update score it has to set 0
      updateScoreElement();
    " class="reset-score-button">Reset Score</button>
    <script src="script/rock-papaer-scissor.js"></script>
  </body>
</html>
