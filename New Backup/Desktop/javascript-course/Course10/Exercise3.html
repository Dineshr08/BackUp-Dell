<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" href="styles/Exercise3.css">
    <title>
      Calculator - Functions
    </title>

  </head>
  <body>
    <p>
      Calculator
    </p>
    <p class="js-display calculation"></p>
    <p>
      <button class="calculator-button gray-button" onclick="
      updateCalculation('1');
      ">1</button>
    <button class="calculator-button gray-button" onclick="
      updateCalculation('2');
    ">2</button>
    <button class="calculator-button gray-button" onclick="
      updateCalculation('3');
    ">3</button>
    <button class="calculator-button orange-button" onclick="
      updateCalculation('+');
    ">+</button>
    </p>
    <p>
      <button class="calculator-button gray-button" onclick="
        updateCalculation('4');
      ">4</button>
    <button class="calculator-button gray-button" onclick="
      updateCalculation('5');
    ">5</button>
    <button class="calculator-button gray-button" onclick="
      updateCalculation('6');
    ">6</button>
    <button class="calculator-button orange-button" onclick="
      updateCalculation('-');
    ">-</button>
   
    </p>
    <p>
      <button class="calculator-button gray-button" onclick="
        updateCalculation('7');
      ">7</button>
    <button class="calculator-button gray-button" onclick="
      updateCalculation('8');
    ">8</button>
    <button class="calculator-button gray-button" onclick="
      updateCalculation('9');
    ">9</button>
    <button class="calculator-button orange-button" onclick="
      updateCalculation('*');
    ">*</button>
  
    </p>
    <p>
      <button class="calculator-button gray-button" onclick="
      updateCalculation('0');
      ">0</button>
    <button class="calculator-button gray-button" onclick="
      updateCalculation('.');
    ">.</button>
    <button class="calculator-button gray-button" onclick="
     // Note: eval() takes a string and runs it as code.
        // Avoid using eval() in real world projects since
        // it can potentially be given harmful code to run.
        // Only use eval() for learning purposes.
      calculation=eval(calculation)
      console.log(calculation);
      localStorage.setItem('calculation', calculation);
      displayResult();
    ">=</button>
    <button class="calculator-button orange-button" onclick="
      updateCalculation('/');
    ">/</button>
    </p>
    
    <button class="calculator-button gray-button clear-button" onclick="
      console.log('Cleared');
      calculation='';
      // console.log(calculation)
      localStorage.setItem('calculation', calculation);
      displayResult();
    ">Clear</button>
    <script src="scripts/Exercise3.js"></script>
  </body>
</html>
