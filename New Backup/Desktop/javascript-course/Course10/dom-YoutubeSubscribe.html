<!--What we do here is if we click subscribe it will become subscribed else subscribe using dom here creating fn and perform all the operation there and call here-->
<!DOCTYPE html>
<html>
  <head>
    <style>

      body {
        font-family: Arial;
      }

      .subscribe-button {
        border: none; 
        background-color: black;
        color: white;
        padding-top: 10px; 
        padding-bottom: 10px; 
        padding-left: 15px; 
        padding-right: 15px;  
        font-weight: bold; 
        border-radius: 50px; 
        cursor: pointer; 
        margin-bottom: 30px; 
      }
      .is-subscribed {
        background-color: rgb(240, 240, 240);
        color: black;
      }

    </style>

    <title>Dom </title>
  </head>
  <body>
    <p>YouTube Subscribe Button</p>
    <button onclick="
      subscribe();
    " class="js-subscribe-button subscribe-button">Subscribe</button>
    <script>

      function subscribe() {
        const buttonElement = document.querySelector('.js-subscribe-button');
        if(buttonElement.innerHTML === 'Subscribe') {
          buttonElement.innerHTML = 'Subscribed';
          buttonElement.classList.add('is-subscribed');
        } else {
          buttonElement.innerHTML = 'Subscribe';
          buttonElement.classList.remove('is-subscribed');
        }
      }

    </script>
  </body>
</html>
