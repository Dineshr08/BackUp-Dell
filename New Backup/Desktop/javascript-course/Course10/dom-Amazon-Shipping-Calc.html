<!DOCTYPE html>
<html>
  <head>
    <style>

      body {
        font-family: Arial;
      }

      .subscribe-button {
        border: none; 
        background-color: rgb(6, 4, 4);
        color: white;
        padding-top: 10px; 
        padding-bottom: 10px; 
        padding-left: 15px; 
        padding-right: 15px;  
        font-weight: bold; 
        border-radius: 50px; 
        cursor: pointer; 
        margin-bottom: 30px; 
      }
      .is-subscribed {
        background-color: rgb(240, 240, 240);
        color: black;
      }

       .cost-input {
        font-size: 15px;
        /*
        padding-top: 10px;
        padding-bottom: 10px;
        padding-left: 10px;
        padding-right: 10px;
        */
        padding: 10px;
      }

      .calculate-button {
        background-color: green;
        color: white;
        border: none;
        font-size: 15px;
        padding: 12px 15px;
        cursor: pointer;
      }

    </style>
    <title>Dom - Amazon Shipping Calculator</title>
  </head>
  <body>
    <p>Amazon Shipping Calculator</p>
    <p class>Orders under $40 = +$10 shipping.</p>
    <p class>Orders over $40 = FREE shipping.</p>
    <input placeholder="Cost of order" class="js-input cost-input" onkeydown="
      handleCostKeyDown(event);
    ">
    <button onclick="
      costCalculate();
    " class="calculate-button">Calculate</button>
    <p class="js-dollor-result"></p>
    <script>

      function handleCostKeyDown(event) {
        if (event.key === 'Enter') {
          costCalculate();
        }
      }

      function costCalculate() {
        const inputElement = document.querySelector('.js-input');
        let cost = Number(inputElement.value)
        if (cost < 40) {
          cost += 10;
        }

        document.querySelector('.js-dollor-result').innerHTML = `$${cost}`;

      }

    </script>
  </body>
</html>
