<!DOCTYPE html>
<html>
  <head>
    <title>Exercise1</title>
  </head>
  <body>
    <script>
      function greet(name) {
        if (!name) {
          console.log(`Hello There!`);
        }
        
      }
      greet();

      function convertToFarenheit(farenheit, unit) {

        Celsius = (farenheit - 32) * 5 / 9;
        console.log(`Celcius is: ${Celsius}`);
        return (`${Celsius}${unit}`);

      }

      function convertToCelsius(celsius, unit) {

        Fahrenheit = (celsius * 5 / 9) + 32;
        console.log(`Farenheit is: ${Fahrenheit}`);
        return (`${Fahrenheit}${unit}`);

      }

      function convertTemperature(degrees, unit) {

        if (unit === 'C') {
          temp = convertToFarenheit(degrees, unit);
        } else {
          temp = convertToCelsius(degrees, unit);
        }

        return temp;

      }

      function convertKmToMiles(length, to) {

        Miles = length * 0.621371;
        return (`${Miles} ${to}`);

      }

      function convertMilesToKm(length, to) {

        Kilometers = length * 1.60934;
        return (`${Kilometers} ${to}`);

      }

      function convertLengthToFeet(length, to) {

        Feet=length * 3280.84;
        return (`${Feet} ${to}`);

      }

      function convertLength(length, from, to) {

        if (from === 'km') {

          result = convertKmToMiles(length, to);

        } else if (from === 'miles') {

          result = convertMilesToKm(length, to);

        } else if (from === 'km' && to === 'km') {

          result = `${length} ${to}`;

        } else if (from === 'miles' && to === 'miles') {

          result = `${length} ${to}`;

        } else if (from === 'ft') {

          result = convertLengthToFeet(length, to);

        }

        return result;

      }

      console.log(convertTemperature(99, 'F'));
      console.log(convertLength(50, 'miles', 'km'));
      console.log(convertLength(32, 'km', 'miles'));
      console.log(convertLength(50, 'km', 'km'));
      console.log(convertLength(5, 'miles', 'km'));
      console.log(convertLength(5, 'miles', 'ft'));
      console.log(convertLength(5, 'km', 'ft'));


    </script>
  </body>
</html>
