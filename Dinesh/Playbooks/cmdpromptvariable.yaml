---
 - name: using command prompt variable
   hosts: all
   vars_prompt:
     - name: x
       prompt: Enter the value of x
       private: no
     - name: y
       prompt: Enter value of y
       private: no
   tasks:
   - name: getting value of x and y and printing
     debug:
       msg:
         - "Printing value of x:{{x}}"
         - "Priniting value of y: {{y}}"
